<div class="canvas">
  <img src="base.png" class="base">

  <img id="partA" src="partA.png">
  <img id="partB" src="partB.png">
  <img id="partC" src="partC.png">

  <img id="markChest">
  <img id="markBack">
</div>

<div>
  <h3>Aカラー</h3>
  <button onclick="setColor('A','red')">赤</button>
  <button onclick="setColor('A','blue')">青</button>

  <h3>Bカラー</h3>
  <button onclick="setColor('B','black')">黒</button>
  <button onclick="setColor('B','white')">白</button>

  <h3>Cカラー</h3>
  <button onclick="setColor('C','pink')">ピンク</button>
  <button onclick="setColor('C','green')">緑</button>

  <h3>胸マーク</h3>
  <button onclick="setMark('bms.png')">bms</button>
  <button onclick="setMark('biarms.png')">biarms</button>

  <h3>背中マーク</h3>
  <button onclick="setBackMark('bms.png')">bms</button>
  <button onclick="setBackMark('edgeb.png')">edgeb</button>
</div>

<script>
function setColor(part, color) {
  document.getElementById("part"+part).style.filter =
    color === "red" ? "hue-rotate(0deg)" :
    color === "blue" ? "hue-rotate(200deg)" :
    color === "black" ? "brightness(0.3)" :
    color === "white" ? "brightness(1.8)" :
    color === "pink" ? "hue-rotate(300deg)" :
    "hue-rotate(100deg)";
}

function setMark(src) {
  document.getElementById("markChest").src = src;
}

function setBackMark(src) {
  document.getElementById("markBack").src = src;
}
</script>

<style>
.canvas {
  position: relative;
  width: 100%;
  max-width: 400px;
}

.canvas img {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
}

.base {
  position: relative;
}
</style>
