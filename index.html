<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ウェットスーツシミュレーター</title>

<style>
body{
  font-family: sans-serif;
  text-align:center;
}

/* ===== スーツ表示 ===== */
.suit-wrap{
  position:relative;
  width:300px;
  margin:0 auto;
}

.suit-wrap img{
  position:absolute;
  top:0;
  left:0;
  width:100%;
}

/* 重なり順 */
#base{z-index:1;}
#partB{z-index:2;}
#partC{z-index:3;}
#partA{z-index:4;}
#mark{z-index:5;}

.controls{
  margin-top:320px;
}

button{
  margin:5px;
  padding:10px 15px;
  border-radius:20px;
  border:none;
  background:#eee;
}
</style>
</head>

<body>

<h2>ウェットスーツシミュレーター</h2>

<!-- ===== 表示 ===== -->
<div class="suit-wrap">
  <img id="base" src="base.png">
  <img id="partB" src="partB_front.png">
  <img id="partC" src="partC_front.png">
  <img id="partA" src="partA.png">
  <img id="mark" src="">
</div>

<!-- ===== 操作 ===== -->
<div class="controls">

<h3>A（袖）</h3>
<button onclick="changeA('black')">ブラック</button>
<button onclick="changeA('pink')">ピンク</button>
<button onclick="changeA('blue')">ブルー</button>

<h3>B（ボディ）</h3>
<button onclick="changeB('black')">ブラック</button>
<button onclick="changeB('red')">レッド</button>
<button onclick="changeB('blue')">ブルー</button>

<h3>C（ライン）</h3>
<button onclick="changeC('black')">ブラック</button>
<button onclick="changeC('yellow')">イエロー</button>

<h3>マーク</h3>
<button onclick="setMark('bms.png')">BMS</button>
<button onclick="setMark('letter.png')">レター</button>
<button onclick="setMark('edgeb.png')">エッジ</button>

</div>

<script>

/* ===== パーツ変更 ===== */
function changeA(color){
  document.getElementById("partA").src = "partA.png";
}

function changeB(color){
  document.getElementById("partB").src = "partB_front.png";
}

function changeC(color){
  document.getElementById("partC").src = "partC_front.png";
}

/* ===== マーク ===== */
function setMark(file){
  document.getElementById("mark").src = file;
}

</script>

</body>
</html>
