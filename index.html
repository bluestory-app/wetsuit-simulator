<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>フルオーダーウェットスーツ</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 10px;
      margin: 0;
      background: #fff;
      color: #111;
    }

    h1 {
      font-size: 18px;
      line-height: 1.4;
      margin-bottom: 10px;
    }

    .section {
      margin-top: 15px;
    }

    .center {
      text-align: center;
    }

    .suit-image {
      width: 320px;
      max-width: 100%;
      height: auto;
    }

    button {
      margin: 3px;
      padding: 8px 10px;
      border: 1px solid #ccc;
      background: #f7f7f7;
      border-radius: 6px;
      cursor: pointer;
    }

    button.active {
      background: #111;
      color: #fff;
      border-color: #111;
    }

    select {
      padding: 8px;
      margin-top: 5px;
      width: 100%;
      max-width: 260px;
    }

    .box {
      border: 1px solid #ddd;
      padding: 10px;
      border-radius: 8px;
      background: #fafafa;
    }

    #result {
      line-height: 1.8;
    }

    #price {
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>
    フルオーダーウェットスーツ<br>
    明治大学Roco
  </h1>

  <div class="section center">
    <img src="E153157A-B698-4370-BD4A-FEDB254041FD.png" alt="ウェットスーツ" class="suit-image">
  </div>

  <div class="section">
    <b>パーツ選択</b><br>
    <button id="btnA" onclick="selectPart('A')">A（袖）</button>
    <button id="btnB" onclick="selectPart('B')">B（ボディ）</button>
    <button id="btnC" onclick="selectPart('C')">C（首胸・脇）</button>
    <button id="btnD" onclick="selectPart('D')">D（ステッチ）</button>
  </div>

  <div class="section">
    <b>カラー</b><br>
    <div id="colors"></div>
  </div>

  <div class="section">
    <b>迷彩カラー</b><br>
    <div id="camo"></div>
  </div>

  <div class="section">
    <b>マーク（右胸）</b><br>
    <select id="markRight">
      <option>なし</option>
      <option>ピーク</option>
      <option>bms</option>
      <option>ウロコ</option>
      <option>エッジb</option>
      <option>レター</option>
    </select>
  </div>

  <div class="section">
    <b>マーク（背中）</b><br>
    <select id="markBack">
      <option>なし</option>
      <option>ピーク</option>
      <option>bms</option>
      <option>エッジb</option>
      <option>レター</option>
    </select>
  </div>

  <div class="section">
    <b>マークカラー</b><br>
    <select id="markColor">
      <option>黒</option>
      <option>白</option>
      <option>金</option>
      <option>シルバー</option>
      <option>ガンメタ</option>
      <option>赤</option>
      <option>青</option>
    </select>
  </div>

  <div class="section box">
    <b>現在の設定</b><br>
    <div id="result"></div>
  </div>

  <div class="section box">
    <b>追加料金</b><br>
    <div id="price">¥0</div>
  </div>

  <div class="section">
    <button onclick="sendToLine()">LINEで相談する</button>
  </div>

  <script>
    let currentPart = "A";

    let data = {
      A: "ブラック",
      B: "ブラック",
      C: "ブラック",
      D: "ホワイト"
    };

    const colors = [
      "ブラック", "ホワイト", "レッド", "キャンディ", "Kイエロー",
      "Kオレンジ", "オレンジ", "ターコイズ", "ロイヤル", "ネイビー",
      "ソリッドブルー", "プラクシス", "ブラウン", "ダークグレー", "クールグレイ",
      "オリーブ", "ペブル", "サンド", "メランジBK", "メランジ青",
      "ベビーピンク", "マルベリー", "キラ", "ピスタチオ"
    ];

    const camo = ["カモブラック", "カモグレイ", "カモカーキ"];

    function selectPart(p) {
      currentPart = p;
      updatePartButtons();
    }

    function updatePartButtons() {
      document.getElementById("btnA").classList.remove("active");
      document.getElementById("btnB").classList.remove("active");
      document.getElementById("btnC").classList.remove("active");
      document.getElementById("btnD").classList.remove("active");

      document.getElementById("btn" + currentPart).classList.add("active");
    }

    function renderColors() {
      let html = "";
      colors.forEach(c => {
        html += `<button onclick="setColor('${c}')">${c}</button>`;
      });
      document.getElementById("colors").innerHTML = html;
    }

    function renderCamo() {
      let html = "";
      camo.forEach(c => {
        html += `<button onclick="setCamo('${c}')">${c}</button>`;
      });
      document.getElementById("camo").innerHTML = html;
    }

    function setColor(c) {
      data[currentPart] = c;
      update();
    }

    function setCamo(c) {
      if (currentPart === "A" || currentPart === "C") {
        data[currentPart] = c;
      } else {
        alert("このパーツには使えません");
      }
      update();
    }

    function calcPrice() {
      let p = 0;
      if (data.A.includes("カモ")) p += 4500;
      if (data.C.includes("カモ")) p += 3500;
      return p;
    }

    function update() {
      document.getElementById("result").innerHTML =
        `A：${data.A}<br>` +
        `B：${data.B}<br>` +
        `C：${data.C}<br>` +
        `D：${data.D}`;

      document.getElementById("price").innerText =
        "¥" + calcPrice().toLocaleString();
    }

    function sendToLine() {
      let text =
`【ウェットスーツカラー相談】

Aベース：${data.A}
Bベース：${data.B}
Cベース：${data.C}
ステッチ：${data.D}

追加料金：¥${calcPrice().toLocaleString()}

右胸マーク：${document.getElementById("markRight").value}（${document.getElementById("markColor").value}）
背中マーク：${document.getElementById("markBack").value}（${document.getElementById("markColor").value}）`;

      let url = "https://line.me/R/msg/text/?" + encodeURIComponent(text);
      window.open(url);
    }

    renderColors();
    renderCamo();
    updatePartButtons();
    update();
  </script>

</body>
</html>
