<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ウェットスーツシミュレーター</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      font-family: sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    .wrap {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 28px;
      line-height: 1.4;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .viewer {
      position: relative;
      width: 100%;
      max-width: 980px;
      margin: 0 auto;
    }

    .viewer img {
      width: 100%;
      display: block;
    }

    .base-layer {
      position: relative;
      z-index: 1;
    }

    .part-layer {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2;
      pointer-events: none;
      mix-blend-mode: multiply;
    }

    .mark-layer {
      position: absolute;
      z-index: 3;
      pointer-events: none;
    }

    .mark-layer img {
      width: 100%;
      display: block;
    }

    .section-title {
      font-size: 22px;
      font-weight: 700;
      margin: 0 0 12px;
    }

    .sub-title {
      font-size: 18px;
      font-weight: 700;
      margin: 18px 0 10px;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      border: 1px solid #ccc;
      background: #f0f0f0;
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 15px;
      cursor: pointer;
    }

    button.active {
      background: #dbeafe;
      border-color: #93c5fd;
      color: #111;
      font-weight: 700;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      background: #fff;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .mark-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .preview-box {
      background: #000;
      border-radius: 12px;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .preview-box img {
      max-width: 180px;
      max-height: 90px;
      width: auto;
      height: auto;
    }

    .result {
      white-space: pre-line;
      line-height: 1.9;
      font-size: 18px;
    }

    .action-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    @media (max-width: 768px) {
      h1 { font-size: 24px; }
      .section-title { font-size: 20px; }
      .sub-title { font-size: 17px; }
      .form-grid,
      .mark-box {
        grid-template-columns: 1fr;
      }
      .result {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>ウェットスーツシミュレーター</h1>

    <!-- 1. ウェットスーツ画像 -->
    <div class="card">
      <div class="viewer" id="viewer">
        <img src="base.png" class="base-layer" alt="base">

        <img id="partA" src="partA_new.png" class="part-layer" alt="partA">
        <img id="partB" src="partB_new.png" class="part-layer" alt="partB">
        <img id="partC" src="partC_new.png" class="part-layer" alt="partC">

        <!-- 胸マーク -->
        <div id="chestMarkWrap" class="mark-layer" style="left:20.5%; top:16.8%; width:8.2%;">
          <img id="chestMarkImg" src="bms.png" alt="chest mark">
        </div>

        <!-- 背中マーク -->
        <div id="backMarkWrap" class="mark-layer" style="left:71.2%; top:17.8%; width:8.4%;">
          <img id="backMarkImg" src="bms.png" alt="back mark">
        </div>
      </div>
    </div>

    <!-- 2. Aカラー -->
    <div class="card">
      <div class="section-title">Aカラー</div>
      <div class="btn-row" id="aButtons"></div>
    </div>

    <!-- 3. Bカラー -->
    <div class="card">
      <div class="section-title">Bカラー</div>
      <div class="btn-row" id="bButtons"></div>
    </div>

    <!-- 4. Cカラー -->
    <div class="card">
      <div class="section-title">Cカラー</div>
      <div class="btn-row" id="cButtons"></div>
    </div>

    <!-- 5. 胸マーク -->
    <div class="card">
      <div class="section-title">胸マーク</div>
      <div class="mark-box">
        <div>
          <select id="chestMark" onchange="updateMarks()">
            <option value="bms.png">bms</option>
            <option value="biarms.png">biarms</option>
            <option value="edgeb.png">edgeb</option>
            <option value="letter.png">letter</option>
          </select>

          <div class="sub-title">胸マーク色</div>
          <select id="chestMarkColor" onchange="updateMarks()">
            <option value="white">ホワイト</option>
            <option value="black">ブラック</option>
            <option value="red">レッド</option>
            <option value="blue">ブルー</option>
            <option value="yellow">イエロー</option>
            <option value="pink">ピンク</option>
            <option value="silver">シルバー</option>
            <option value="gold">ゴールド</option>
          </select>
        </div>
        <div class="preview-box">
          <img id="chestMarkPreview" src="bms.png" alt="chest preview">
        </div>
      </div>
    </div>

    <!-- 6. 背中マーク -->
    <div class="card">
      <div class="section-title">背中マーク</div>
      <div class="mark-box">
        <div>
          <select id="backMark" onchange="updateMarks()">
            <option value="bms.png">bms</option>
            <option value="biarms.png">biarms</option>
            <option value="edgeb.png">edgeb</option>
            <option value="letter.png">letter</option>
          </select>

          <div class="sub-title">背中マーク色</div>
          <select id="backMarkColor" onchange="updateMarks()">
            <option value="white">ホワイト</option>
            <option value="black">ブラック</option>
            <option value="red">レッド</option>
            <option value="blue">ブルー</option>
            <option value="yellow">イエロー</option>
            <option value="pink">ピンク</option>
            <option value="silver">シルバー</option>
            <option value="gold">ゴールド</option>
          </select>
        </div>
        <div class="preview-box">
          <img id="backMarkPreview" src="bms.png" alt="back preview">
        </div>
      </div>
    </div>

    <!-- 7. お客様情報 -->
    <div class="card">
      <div class="section-title">お客様情報</div>
      <div class="form-grid">
        <div>
          <div class="sub-title">名前</div>
          <input id="customerName" type="text" placeholder="名前を入力">
        </div>
        <div>
          <div class="sub-title">性別</div>
          <select id="gender" onchange="renderResult()">
            <option value="">選択してください</option>
            <option value="男性">男性</option>
            <option value="女性">女性</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 8. 現在の設定 -->
    <div class="card">
      <div class="section-title">現在の設定</div>
      <div id="result" class="result"></div>
    </div>

    <!-- 9. 保存・LINE送信 -->
    <div class="card">
      <div class="action-row">
        <button type="button" onclick="saveSetting()">保存</button>
        <button type="button" onclick="sendToLine()">LINE送信</button>
      </div>
    </div>
  </div>

  <script>
    const colors = [
      'ブラック','ホワイト','レッド','キャンディ','Kイエロー','Kオレンジ','オレンジ',
      'ターコイズ','ロイヤル','ネイビー','ソリッドブルー','プラクシス',
      'ブラウン','ダークグレイ','クールグレイ','オリーブ','ペブル','サンド',
      'メランジBK','メランジ青','ベビーピンク','マルベリー','キラ','ピスタチオ'
    ];

    const state = {
      A: 'ブラック',
      B: 'ブラック',
      C: 'ブラック'
    };

    const colorFilterMap = {
  ブラック: 'brightness(0.22) contrast(1.1)',
  ホワイト: 'brightness(2.0) saturate(0) contrast(1.05)',
  レッド: 'sepia(1) saturate(9) hue-rotate(-10deg) brightness(0.9)',

  キャンディ: 'sepia(1) saturate(8) hue-rotate(-35deg) brightness(1.05) contrast(1.03)',
  Kイエロー: 'sepia(1) saturate(8) hue-rotate(5deg) brightness(1.1) contrast(1.03)',
  Kオレンジ: 'sepia(1) saturate(8) hue-rotate(-5deg) brightness(1.05) contrast(1.03)',

  オレンジ: 'sepia(1) saturate(9) hue-rotate(-3deg) brightness(0.85)',
  ターコイズ: 'sepia(1) saturate(6) hue-rotate(145deg) brightness(1.0) contrast(1.03)',
  ロイヤル: 'sepia(1) saturate(7) hue-rotate(175deg) brightness(0.95) contrast(1.03)',

  ネイビー: 'sepia(1) saturate(6) hue-rotate(205deg) brightness(0.35)',
  ソリッドブルー: 'sepia(1) saturate(7) hue-rotate(170deg) brightness(1.0) contrast(1.03)',
  プラクシス: 'sepia(1) saturate(7) hue-rotate(255deg) brightness(0.95) contrast(1.03)',

  ブラウン: 'sepia(1) saturate(4) hue-rotate(-8deg) brightness(0.55)',
  ダークグレイ: 'grayscale(1) brightness(0.35) contrast(1.1)',
  クールグレイ: 'grayscale(1) brightness(0.85) contrast(1.05)',

  オリーブ: 'sepia(1) saturate(4) hue-rotate(60deg) brightness(0.7)',
  ペブル: 'sepia(1) saturate(3) hue-rotate(10deg) brightness(1.0)',
  サンド: 'sepia(1) saturate(4) hue-rotate(20deg) brightness(1.1)',

  メランジbk: 'grayscale(1) brightness(0.6) contrast(1.2)',
  メランジ青: 'sepia(1) saturate(3) hue-rotate(170deg) brightness(1.2)',

  ベビーピンク: 'sepia(1) saturate(6) hue-rotate(-20deg) brightness(1.2)',
  マルベリー: 'sepia(1) saturate(8) hue-rotate(260deg) brightness(0.7)',
  キラ: 'sepia(1) saturate(10) hue-rotate(300deg) brightness(1.1)',

  ピスタチオ: 'sepia(1) saturate(4) hue-rotate(80deg) brightness(1.0)'
};
    
    const markFilterMap = {
      white: 'brightness(0) invert(1)',
      black: 'brightness(0)',
      red: 'sepia(1) saturate(7) hue-rotate(-20deg) brightness(0.95)',
      blue: 'sepia(1) saturate(7) hue-rotate(170deg) brightness(1.0)',
      yellow: 'sepia(1) saturate(8) hue-rotate(5deg) brightness(1.1)',
      pink: 'sepia(1) saturate(4) hue-rotate(-45deg) brightness(1.15)',
      silver: 'grayscale(1) brightness(1.3)',
      gold: 'sepia(1) saturate(6) hue-rotate(8deg) brightness(1.15)'
    };

    function createColorButtons(targetId, partKey) {
      const wrap = document.getElementById(targetId);
      wrap.innerHTML = '';

      colors.forEach(color => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = color;
        btn.onclick = () => {
          state[partKey] = color;
          applyColors();
          updateActiveButtons();
          renderResult();
        };
        btn.dataset.part = partKey;
        btn.dataset.color = color;
        wrap.appendChild(btn);
      });
    }

    function updateActiveButtons() {
      document.querySelectorAll('button[data-part]').forEach(btn => {
        const part = btn.dataset.part;
        const color = btn.dataset.color;
        btn.classList.toggle('active', state[part] === color);
      });
    }

    function applyColors() {
      document.getElementById('partA').style.filter = colorFilterMap[state.A] || 'none';
      document.getElementById('partB').style.filter = colorFilterMap[state.B] || 'none';
      document.getElementById('partC').style.filter = colorFilterMap[state.C] || 'none';
    }

    function updateMarks() {
      const chest = document.getElementById('chestMark').value;
      const back = document.getElementById('backMark').value;
      const chestColor = document.getElementById('chestMarkColor').value;
      const backColor = document.getElementById('backMarkColor').value;

      document.getElementById('chestMarkImg').src = chest;
      document.getElementById('backMarkImg').src = back;
      document.getElementById('chestMarkPreview').src = chest;
      document.getElementById('backMarkPreview').src = back;

      document.getElementById('chestMarkImg').style.filter = markFilterMap[chestColor] || 'none';
      document.getElementById('backMarkImg').style.filter = markFilterMap[backColor] || 'none';
      document.getElementById('chestMarkPreview').style.filter = markFilterMap[chestColor] || 'none';
      document.getElementById('backMarkPreview').style.filter = markFilterMap[backColor] || 'none';

      renderResult();
    }

    function renderResult() {
      const name = document.getElementById('customerName').value || '';
      const gender = document.getElementById('gender').value || '';
      const chestMark = document.getElementById('chestMark').selectedOptions[0].textContent;
      const backMark = document.getElementById('backMark').selectedOptions[0].textContent;
      const chestMarkColor = document.getElementById('chestMarkColor').selectedOptions[0].textContent;
      const backMarkColor = document.getElementById('backMarkColor').selectedOptions[0].textContent;

      document.getElementById('result').textContent =
`名前：${name}
性別：${gender}
Aカラー：${state.A}
Bカラー：${state.B}
Cカラー：${state.C}
胸マーク：${chestMark}
胸マーク色：${chestMarkColor}
背中マーク：${backMark}
背中マーク色：${backMarkColor}`;
    }

    function saveSetting() {
      const saveData = {
        name: document.getElementById('customerName').value,
        gender: document.getElementById('gender').value,
        A: state.A,
        B: state.B,
        C: state.C,
        chestMark: document.getElementById('chestMark').value,
        backMark: document.getElementById('backMark').value,
        chestMarkColor: document.getElementById('chestMarkColor').value,
        backMarkColor: document.getElementById('backMarkColor').value
      };

      localStorage.setItem('wetsuit-simulator-data', JSON.stringify(saveData));
      alert('保存しました');
    }

    function loadSetting() {
      const raw = localStorage.getItem('wetsuit-simulator-data');
      if (!raw) return;

      try {
        const data = JSON.parse(raw);
        document.getElementById('customerName').value = data.name || '';
        document.getElementById('gender').value = data.gender || '';
        state.A = data.A || 'ブラック';
        state.B = data.B || 'ブラック';
        state.C = data.C || 'ブラック';
        document.getElementById('chestMark').value = data.chestMark || 'bms.png';
        document.getElementById('backMark').value = data.backMark || 'bms.png';
        document.getElementById('chestMarkColor').value = data.chestMarkColor || 'white';
        document.getElementById('backMarkColor').value = data.backMarkColor || 'white';
      } catch (e) {}
    }

    function sendToLine() {
      const name = document.getElementById('customerName').value || '';
      const gender = document.getElementById('gender').value || '';
      const chestMark = document.getElementById('chestMark').selectedOptions[0].textContent;
      const backMark = document.getElementById('backMark').selectedOptions[0].textContent;
      const chestMarkColor = document.getElementById('chestMarkColor').selectedOptions[0].textContent;
      const backMarkColor = document.getElementById('backMarkColor').selectedOptions[0].textContent;

      const text =
`【ウェットスーツシミュレーター】
名前：${name}
性別：${gender}
Aカラー：${state.A}
Bカラー：${state.B}
Cカラー：${state.C}
胸マーク：${chestMark}
胸マーク色：${chestMarkColor}
背中マーク：${backMark}
背中マーク色：${backMarkColor}`;

      window.open('https://line.me/R/msg/text/?' + encodeURIComponent(text), '_blank');
    }

    document.getElementById('customerName').addEventListener('input', renderResult);

    createColorButtons('aButtons', 'A');
    createColorButtons('bButtons', 'B');
    createColorButtons('cButtons', 'C');

    loadSetting();
    applyColors();
    updateActiveButtons();
    updateMarks();
    renderResult();
  </script>
</body>
</html>
