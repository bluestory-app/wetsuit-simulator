<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>フルオーダーウェットスーツ</title>
<style>
body { font-family: sans-serif; padding: 10px; }
h1 { font-size: 18px; }
.section { margin-top: 15px; }
button { margin: 3px; padding: 8px; }
img { background: #000; } /* 白ロゴ見やすく */
</style>
</head>
<body>

<h1>
フルオーダーウェットスーツ<br>
明治大学Roco
</h1>

<div class="section" style="text-align:center;">
<img src="suit.png" width="600">
</div>

<div class="section">
<b>パーツ選択</b><br>
<button onclick="selectPart('A')">A（袖）</button>
<button onclick="selectPart('B')">B（ボディ）</button>
<button onclick="selectPart('C')">C（首胸）</button>
<button onclick="selectPart('D')">D（ステッチ）</button>
</div>

<div class="section">
<b>カラー</b><br>
<div id="colors"></div>
</div>

<div class="section">
<b>マーク（右胸）</b><br>
<select id="markRight" onchange="changeMarkRight()">
<option>bms</option>
<option>ウロコ</option>
<option>エッジb</option>
<option>レター</option>
</select>

<div>
<img id="markRightImg" src="bms.png" width="100">
</div>
</div>

<div class="section">
<b>マーク（背中）</b><br>
<select id="markBack" onchange="changeMarkBack()">
<option>bms</option>
<option>ウロコ</option>
<option>エッジb</option>
<option>レター</option>
</select>

<div>
<img id="markBackImg" src="bms.png" width="100">
</div>
</div>

<div class="section">
<b>現在の設定</b><br>
<div id="result"></div>
</div>

<script>

let currentPart = "A";

let data = {
A: "ブラック",
B: "ブラック",
C: "ブラック",
D: "ホワイト"
};

const colors = ["ブラック","ホワイト","レッド","ブルー"];

function selectPart(p){
currentPart = p;
}

function renderColors(){
let html = "";
colors.forEach(c=>{
html += `<button onclick="setColor('${c}')">${c}</button>`;
});
document.getElementById("colors").innerHTML = html;
}

function setColor(c){
data[currentPart] = c;
update();
}

function update(){
document.getElementById("result").innerHTML =
`Aベース：${data.A}<br>
Bベース：${data.B}<br>
ライン：${data.C}<br>
ステッチ：${data.D}`;
}

function changeMarkRight(){
let val = document.getElementById("markRight").value;
document.getElementById("markRightImg").src = getFile(val);
}

function changeMarkBack(){
let val = document.getElementById("markBack").value;
document.getElementById("markBackImg").src = getFile(val);
}

function getFile(name){
if(name === "bms") return "bms.png";
if(name === "ウロコ") return "uroko.png";
if(name === "エッジb") return "edgeb.png";
if(name === "レター") return "letter.png";
return "bms.png";
}

renderColors();
update();

</script>

</body>
</html>
