<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ウェットスーツシミュレーター</title>

<style>
body {
  font-family: sans-serif;
  padding: 10px;
}

h1 {
  font-size: 18px;
}

.section {
  margin-top: 15px;
}

button {
  margin: 3px;
  padding: 8px;
}

.suit {
  width: 520px;
  max-width: 100%;
}

.mark {
  background: black;
  display: inline-block;
  padding: 5px;
  margin-top: 5px;
}

.mark img {
  width: 120px;
}
</style>
</head>

<body>

<h1>
フルオーダーウェットスーツ<br>
明治大学Roco
</h1>

<div class="section">
<img src="suit.png" class="suit">
</div>

<div class="section">
<b>パーツ選択</b><br>
<button onclick="selectPart('A')">A（袖）</button>
<button onclick="selectPart('B')">B（ボディ）</button>
<button onclick="selectPart('C')">C（首胸）</button>
<button onclick="selectPart('D')">D（ステッチ）</button>
</div>

<div class="section">
<b>カラー</b><br>
<div id="colors"></div>
</div>

<div class="section">
<b>マーク（右胸）</b><br>
<select id="markRight" onchange="changeMarkRight()">
<option value="bms">bms</option>
<option value="biarms">ピーク</option>
<option value="edgeb">エッジb</option>
<option value="letter">レター</option>
</select>

<div class="mark">
<img id="rightImg" src="bms.png">
</div>
</div>

<div class="section">
<b>マーク（背中）</b><br>
<select id="markBack" onchange="changeMarkBack()">
<option value="bms">bms</option>
<option value="edgeb">エッジb</option>
<option value="letter">レター</option>
</select>

<div class="mark">
<img id="backImg" src="bms.png">
</div>
</div>

<div class="section">
<b>現在の設定</b><br>
<div id="result"></div>
</div>

<script>
let currentPart = "A";

let data = {
  A: "ブラック",
  B: "ブラック",
  C: "ブラック",
  D: "ホワイト"
};

const colors = ["ブラック","ホワイト","レッド","ブルー"];

function selectPart(p){
  currentPart = p;
}

function renderColors(){
  let html = "";
  colors.forEach(c=>{
    html += `<button onclick="setColor('${c}')">${c}</button>`;
  });
  document.getElementById("colors").innerHTML = html;
}

function setColor(c){
  data[currentPart] = c;
  update();
}

function update(){
  document.getElementById("result").innerHTML =
  `Aベース：${data.A}<br>
   Bベース：${data.B}<br>
   ライン：${data.C}<br>
   ステッチ：${data.D}`;
}

function getFile(name){
  if(name === "bms") return "bms.png";
  if(name === "biarms") return "biarms.png";
  if(name === "edgeb") return "edgeb.png";
  if(name === "letter") return "letter.png";
  return "bms.png";
}

function changeMarkRight(){
  const val = document.getElementById("markRight").value;
  document.getElementById("rightImg").src = getFile(val);
}

function changeMarkBack(){
  const val = document.getElementById("markBack").value;
  document.getElementById("backImg").src = getFile(val);
}

renderColors();
update();
</script>

</body>
</html>
