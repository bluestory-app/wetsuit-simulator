<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ウェットスーツシミュレーター</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    .wrap {
      max-width: 980px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 28px;
      line-height: 1.3;
      font-weight: 700;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .viewer-switch {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .view-btn,
    .part-btn,
    .color-btn,
    .action-btn {
      border: 1px solid #cfcfcf;
      background: #efefef;
      color: #1a73e8;
      border-radius: 999px;
      padding: 10px 16px;
      cursor: pointer;
      font-size: 16px;
    }

    .active-btn {
      background: #dbeafe;
      border-color: #93c5fd;
      color: #0f172a;
      font-weight: 700;
    }

    .stage {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 880px;
      margin: 0 auto;
      background: #ececec;
      overflow: hidden;
      border-radius: 12px;
    }

    .layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
      display: none;
    }

    .show {
      display: block;
    }

    .section-title {
      margin: 0 0 12px;
      font-size: 22px;
      font-weight: 700;
    }

    .part-buttons,
    .color-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .mark-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .mark-box {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 12px;
    }

    .mark-title {
      margin: 0 0 10px;
      font-size: 18px;
      font-weight: 700;
    }

    .mark-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    select {
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 10px 12px;
      background: #fff;
      font-size: 16px;
    }

    .mark-preview {
      background: #000;
      min-height: 120px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    .mark-preview img {
      max-width: 180px;
      max-height: 90px;
      object-fit: contain;
      display: block;
    }

    .result {
      white-space: pre-line;
      line-height: 1.9;
      font-size: 18px;
    }

    .action-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 24px;
      }

      .stage {
        max-width: 100%;
        height: 78vh;
        min-height: 620px;
      }

      .mark-grid {
        grid-template-columns: 1fr;
      }

      .section-title {
        font-size: 20px;
      }

      .mark-title {
        font-size: 17px;
      }

      .result {
        font-size: 16px;
      }

      .view-btn,
      .part-btn,
      .color-btn,
      .action-btn {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>フルオーダーウェットスーツ<br>明治大学Roco</h1>

    <div class="card">
      <div class="viewer-switch">
        <button id="frontBtn" class="view-btn active-btn" type="button" onclick="switchView('front')">前</button>
        <button id="backBtn" class="view-btn" type="button" onclick="switchView('back')">後ろ</button>
      </div>

      <div class="stage">
        <!-- FRONT -->
        <img id="baseFront" class="layer show" src="base_front.png" alt="base front">
        <img id="partBFront" class="layer show" src="partB_front.png" alt="partB front">
        <img id="partCFront" class="layer show" src="partC_front.png" alt="partC front">
        <img id="partAFront" class="layer show" src="partA_front.png" alt="partA front">
        <img id="partDFront" class="layer show" src="partD_front.png" alt="partD front">

        <!-- BACK -->
        <img id="baseBack" class="layer" src="base_back.png" alt="base back">
        <img id="partBBack" class="layer" src="partB_back.png" alt="partB back">
        <img id="partCBack" class="layer" src="partC_back.png" alt="partC back">
        <img id="partABack" class="layer" src="partA_back.png" alt="partA back">
        <img id="partDBack" class="layer" src="partD_back.png" alt="partD back">
      </div>
    </div>

    <div class="card">
      <div class="section-title">パーツ選択</div>
      <div class="part-buttons">
        <button id="btnA" class="part-btn active-btn" type="button" onclick="selectPart('A')">A（袖）</button>
        <button id="btnB" class="part-btn" type="button" onclick="selectPart('B')">B（ボディ）</button>
        <button id="btnC" class="part-btn" type="button" onclick="selectPart('C')">C（ライン）</button>
        <button id="btnD" class="part-btn" type="button" onclick="selectPart('D')">D（ステッチ）</button>
      </div>
    </div>

    <div class="card">
      <div class="section-title">カラー</div>
      <div id="colorButtons" class="color-buttons"></div>
    </div>

    <div class="card">
      <div class="mark-grid">
        <div class="mark-box">
          <div class="mark-title">マーク（右胸）</div>
          <div class="mark-row">
            <select id="markRight" onchange="updateMarkPreview('right')">
              <option value="bms.png">bms</option>
              <option value="biarms.png">ピーク</option>
              <option value="edgeb.png">エッジb</option>
              <option value="letter.png">レター</option>
            </select>

            <select id="markRightColor" onchange="updateMarkPreview('right')">
              <option value="white">ホワイト</option>
              <option value="red">レッド</option>
              <option value="gold">ゴールド</option>
              <option value="silver">シルバー</option>
              <option value="gunmetal">ガンメタ</option>
              <option value="kblue">Kブルー</option>
            </select>
          </div>

          <div class="mark-preview">
            <img id="markRightPreview" src="bms.png" alt="right mark">
          </div>
        </div>

        <div class="mark-box">
          <div class="mark-title">マーク（背中）</div>
          <div class="mark-row">
            <select id="markBack" onchange="updateMarkPreview('back')">
              <option value="bms.png">bms</option>
              <option value="biarms.png">ピーク</option>
              <option value="edgeb.png">エッジb</option>
              <option value="letter.png">レター</option>
            </select>

            <select id="markBackColor" onchange="updateMarkPreview('back')">
              <option value="white">ホワイト</option>
              <option value="red">レッド</option>
              <option value="gold">ゴールド</option>
              <option value="silver">シルバー</option>
              <option value="gunmetal">ガンメタ</option>
              <option value="kblue">Kブルー</option>
            </select>
          </div>

          <div class="mark-preview">
            <img id="markBackPreview" src="bms.png" alt="back mark">
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="section-title">現在の設定</div>
      <div id="result" class="result"></div>
    </div>

    <div class="card">
      <div class="action-row">
        <button class="action-btn" type="button" onclick="saveSetting()">保存</button>
        <button class="action-btn" type="button" onclick="sendToLine()">LINE送信</button>
      </div>
    </div>
  </div>

  <script>
    let currentView = 'front';
    let currentPart = 'A';

    const data = {
      A: 'ブラック',
      B: 'ブラック',
      C: 'ブラック',
      D: 'ホワイト'
    };

    const colors = [
      'ブラック',
      'ホワイト',
      'レッド',
      'キャンディ',
      'Kイエロー',
      'Kオレンジ',
      'オレンジ',
      'ターコイズ',
      'ロイヤル',
      'ネイビー',
      'ソリッドブルー',
      'プラクシス',
      'ブラウン',
      'ダークグレイ',
      'クールグレイ',
      'オリーブ',
      'ペブル',
      'サンド',
      'メランジBK',
      'メランジ青',
      'ベビーピンク',
      'マルベリー',
      'キラ',
      'ピスタチオ'
    ];

    const partTargets = {
      A: ['partAFront', 'partABack'],
      B: ['partBFront', 'partBBack'],
      C: ['partCFront', 'partCBack'],
      D: ['partDFront', 'partDBack']
    };

    const colorFilterMap = {
      'ブラック': 'brightness(0.35) saturate(0.9)',
      'ホワイト': 'brightness(1.4) saturate(0)',
      'レッド': 'sepia(1) saturate(7) hue-rotate(-20deg) brightness(0.95)',
      'キャンディ': 'sepia(1) saturate(8) hue-rotate(-35deg) brightness(1.05)',
      'Kイエロー': 'sepia(1) saturate(8) hue-rotate(5deg) brightness(1.1)',
      'Kオレンジ': 'sepia(1) saturate(8) hue-rotate(-5deg) brightness(1.05)',
      'オレンジ': 'sepia(1) saturate(8) hue-rotate(0deg) brightness(1.0)',
      'ターコイズ': 'sepia(1) saturate(6) hue-rotate(145deg) brightness(1.0)',
      'ロイヤル': 'sepia(1) saturate(7) hue-rotate(175deg) brightness(0.95)',
      'ネイビー': 'sepia(1) saturate(7) hue-rotate(190deg) brightness(0.65)',
      'ソリッドブルー': 'sepia(1) saturate(7) hue-rotate(170deg) brightness(1.0)',
      'プラクシス': 'sepia(1) saturate(7) hue-rotate(255deg) brightness(0.95)',
      'ブラウン': 'sepia(1) saturate(4) hue-rotate(-10deg) brightness(0.8)',
      'ダークグレイ': 'grayscale(1) brightness(0.6)',
      'クールグレイ': 'grayscale(1) brightness(0.85)',
      'オリーブ': 'sepia(1) saturate(4) hue-rotate(45deg) brightness(0.75)',
      'ペブル': 'sepia(0.35) saturate(1.2) hue-rotate(20deg) brightness(0.95)',
      'サンド': 'sepia(0.55) saturate(1.4) hue-rotate(10deg) brightness(1.02)',
      'メランジBK': 'grayscale(1) contrast(1.1) brightness(0.5)',
      'メランジ青': 'sepia(1) saturate(4) hue-rotate(180deg) brightness(0.85)',
      'ベビーピンク': 'sepia(1) saturate(4) hue-rotate(-45deg) brightness(1.15)',
      'マルベリー': 'sepia(1) saturate(5) hue-rotate(300deg) brightness(0.95)',
      'キラ': 'brightness(1.2) contrast(1.05) saturate(1.15)',
      'ピスタチオ': 'sepia(1) saturate(4) hue-rotate(65deg) brightness(1.05)'
    };

    const markFilterMap = {
      white: 'none',
      red: 'sepia(1) saturate(8) hue-rotate(-20deg) brightness(0.95)',
      gold: 'sepia(1) saturate(6) hue-rotate(8deg) brightness(1.15)',
      silver: 'grayscale(1) brightness(1.15)',
      gunmetal: 'grayscale(1) brightness(0.65)',
      kblue: 'sepia(1) saturate(7) hue-rotate(175deg) brightness(1.0)'
    };

    function renderColorButtons() {
      const wrap = document.getElementById('colorButtons');
      wrap.innerHTML = '';

      colors.forEach(color => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'color-btn';
        btn.textContent = color;
        btn.onclick = () => setColor(color);
        wrap.appendChild(btn);
      });
    }

    function switchView(view) {
      currentView = view;

      document.getElementById('frontBtn').classList.toggle('active-btn', view === 'front');
      document.getElementById('backBtn').classList.toggle('active-btn', view === 'back');

      const frontIds = ['baseFront', 'partBFront', 'partCFront', 'partAFront', 'partDFront'];
      const backIds = ['baseBack', 'partBBack', 'partCBack', 'partABack', 'partDBack'];

      frontIds.forEach(id => {
        document.getElementById(id).classList.toggle('show', view === 'front');
      });

      backIds.forEach(id => {
        document.getElementById(id).classList.toggle('show', view === 'back');
      });
    }

    function selectPart(part) {
      currentPart = part;
      document.querySelectorAll('.part-btn').forEach(btn => btn.classList.remove('active-btn'));
      document.getElementById('btn' + part).classList.add('active-btn');
    }

    function setColor(color) {
      data[currentPart] = color;
      applyPartColors();
      renderResult();
    }

    function applyPartColors() {
      Object.keys(partTargets).forEach(part => {
        const ids = partTargets[part];
        const filter = colorFilterMap[data[part]] || 'none';

        ids.forEach(id => {
          const el = document.getElementById(id);
          if (el) el.style.filter = filter;
        });
      });
    }

    function updateMarkPreview(side) {
      const isRight = side === 'right';
      const fileSelect = document.getElementById(isRight ? 'markRight' : 'markBack');
      const colorSelect = document.getElementById(isRight ? 'markRightColor' : 'markBackColor');
      const img = document.getElementById(isRight ? 'markRightPreview' : 'markBackPreview');

      img.src = fileSelect.value;
      img.style.filter = markFilterMap[colorSelect.value] || 'none';
      renderResult();
    }

    function renderResult() {
      const rightName = document.getElementById('markRight').selectedOptions[0].textContent;
      const rightColor = document.getElementById('markRightColor').selectedOptions[0].textContent;
      const backName = document.getElementById('markBack').selectedOptions[0].textContent;
      const backColor = document.getElementById('markBackColor').selectedOptions[0].textContent;

      document.getElementById('result').textContent =
`Aベース：${data.A}
Bベース：${data.B}
ライン：${data.C}
ステッチ：${data.D}
右胸マーク：${rightName}
右胸マーク色：${rightColor}
背中マーク：${backName}
背中マーク色：${backColor}`;
    }

    function saveSetting() {
      const saveData = {
        currentView,
        currentPart,
        data,
        markRight: document.getElementById('markRight').value,
        markRightColor: document.getElementById('markRightColor').value,
        markBack: document.getElementById('markBack').value,
        markBackColor: document.getElementById('markBackColor').value
      };

      localStorage.setItem('wetsuit-simulator-setting', JSON.stringify(saveData));
      alert('保存しました');
    }

    function loadSetting() {
      const raw = localStorage.getItem('wetsuit-simulator-setting');
      if (!raw) return;

      try {
        const saved = JSON.parse(raw);

        if (saved.data) {
          data.A = saved.data.A || data.A;
          data.B = saved.data.B || data.B;
          data.C = saved.data.C || data.C;
          data.D = saved.data.D || data.D;
        }

        if (saved.markRight) document.getElementById('markRight').value = saved.markRight;
        if (saved.markRightColor) document.getElementById('markRightColor').value = saved.markRightColor;
        if (saved.markBack) document.getElementById('markBack').value = saved.markBack;
        if (saved.markBackColor) document.getElementById('markBackColor').value = saved.markBackColor;
        if (saved.currentView) currentView = saved.currentView;
        if (saved.currentPart) currentPart = saved.currentPart;
      } catch (e) {}
    }

    function sendToLine() {
      const rightName = document.getElementById('markRight').selectedOptions[0].textContent;
      const rightColor = document.getElementById('markRightColor').selectedOptions[0].textContent;
      const backName = document.getElementById('markBack').selectedOptions[0].textContent;
      const backColor = document.getElementById('markBackColor').selectedOptions[0].textContent;

      const text =
`【ウェットスーツ シミュレーター】
Aベース：${data.A}
Bベース：${data.B}
ライン：${data.C}
ステッチ：${data.D}
右胸マーク：${rightName}
右胸マーク色：${rightColor}
背中マーク：${backName}
背中マーク色：${backColor}`;

      const url = 'https://line.me/R/msg/text/?' + encodeURIComponent(text);
      window.open(url, '_blank');
    }

    renderColorButtons();
    loadSetting();
    selectPart(currentPart);
    switchView(currentView);
    applyPartColors();
    updateMarkPreview('right');
    updateMarkPreview('back');
    renderResult();
  </script>
</body>
</html>
