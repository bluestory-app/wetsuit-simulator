<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ウェットスーツシミュレーター</title>

<style>
body {
  font-family: sans-serif;
  background: #f5f5f5;
  margin: 0;
  padding: 16px;
}

.wrap {
  max-width: 900px;
  margin: auto;
}

h1 {
  font-size: 26px;
  margin-bottom: 16px;
}

.card {
  background: #fff;
  padding: 16px;
  border-radius: 16px;
  margin-bottom: 16px;
}

.viewer {
  position: relative;
}

.viewer img {
  width: 100%;
}

/* ←ここ重要（縫い目白固定） */
.part-layer {
  position: absolute;
  top: 0;
  left: 0;
  mix-blend-mode: multiply;
}

.mark-layer {
  position: absolute;
}

button {
  padding: 8px 12px;
  border-radius: 20px;
  border: 1px solid #ccc;
  margin: 4px;
}

.active {
  background: #cfe3ff;
}
</style>
</head>

<body>
<div class="wrap">

<h1>ウェットスーツシミュレーター</h1>

<!-- 画像 -->
<div class="card">
  <div class="viewer">
    <img src="base.png">

    <img id="partA" src="partA.png" class="part-layer">
    <img id="partB" src="partB.png" class="part-layer">
    <img id="partC" src="partC.png" class="part-layer">

    <!-- 胸 -->
    <div id="chestMarkWrap" class="mark-layer" style="left:20.5%; top:16.8%; width:8%;">
      <img id="chestMarkImg" src="bms.png" style="width:100%;">
    </div>

    <!-- 背中 -->
    <div id="backMarkWrap" class="mark-layer" style="left:71.2%; top:17.8%; width:8%;">
      <img id="backMarkImg" src="bms.png" style="width:100%;">
    </div>
  </div>
</div>

<!-- A -->
<div class="card">
  <h2>Aカラー</h2>
  <div id="aButtons"></div>
</div>

<!-- B -->
<div class="card">
  <h2>Bカラー</h2>
  <div id="bButtons"></div>
</div>

<!-- C -->
<div class="card">
  <h2>Cカラー</h2>
  <div id="cButtons"></div>
</div>

<!-- 胸マーク -->
<div class="card">
  <h2>胸マーク</h2>
  <select id="chestMark" onchange="updateMarks()">
    <option value="bms.png">bms</option>
    <option value="biarms.png">biarms</option>
    <option value="edgeb.png">edgeb</option>
    <option value="letter.png">letter</option>
  </select>
</div>

<!-- 背中 -->
<div class="card">
  <h2>背中マーク</h2>
  <select id="backMark" onchange="updateMarks()">
    <option value="bms.png">bms</option>
    <option value="biarms.png">biarms</option>
    <option value="edgeb.png">edgeb</option>
    <option value="letter.png">letter</option>
  </select>
</div>

<!-- JS -->
<script>
const colors = ["ブラック","ホワイト","レッド","ブルー","グリーン"];

const state = {A:"ブラック",B:"ブラック",C:"ブラック"};

const filterMap = {
  ブラック:"brightness(0.4)",
  ホワイト:"brightness(1.6)",
  レッド:"sepia(1) saturate(6) hue-rotate(-20deg)",
  ブルー:"sepia(1) saturate(6) hue-rotate(180deg)",
  グリーン:"sepia(1) saturate(6) hue-rotate(90deg)"
};

function createButtons(id,key){
  const wrap = document.getElementById(id);
  colors.forEach(c=>{
    const btn=document.createElement("button");
    btn.textContent=c;
    btn.onclick=()=>{
      state[key]=c;
      apply();
    };
    wrap.appendChild(btn);
  });
}

function apply(){
  document.getElementById("partA").style.filter = filterMap[state.A]+" contrast(1.1)";
  document.getElementById("partB").style.filter = filterMap[state.B]+" contrast(1.1)";
  document.getElementById("partC").style.filter = filterMap[state.C]+" contrast(1.1)";
}

function updateMarks(){
  document.getElementById("chestMarkImg").src = document.getElementById("chestMark").value;
  document.getElementById("backMarkImg").src = document.getElementById("backMark").value;
}

createButtons("aButtons","A");
createButtons("bButtons","B");
createButtons("cButtons","C");

apply();
</script>

</div>
</body>
</html>
